[project]
name = "ptech-morelia"
version = "v1.8.1"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [{name = "Thresa Kelly"}, {name = "Sree Kondi"}, {name = "James Hurd"}, {name = "Seth Gabbert"}, {name="Sam Groth"}, {name="Josselyn T Bui"}, {name="Andrew Huang"}]
maintainers = [{name = "Sam Groth"}]
dependencies = [
  "numpy",
  "pandas",
  "pyEDFlib",
  "pyserial",
  "texttable",
  "influxdb-client",
  "reactivex",
  "python-osc",
  "pydantic",     
  "SQLAlchemy",  
  "Pillow>=10.0.0",
  "psutil",
  "toml",
  "pypvfs>=0.1.0,<2",
  "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
docs = [
  "sphinx",
  "autodoc",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints"
]

tests = [
  "pytest",
]

video = [
  "av; python_version < '3.11'"
]

d2xx-windows = [
  "ftd2xx; sys_platform == 'win32'",
]

d2xx-linux = [
  "pylibftdi; sys_platform != 'win32'",
]

d2xx = [
  "ftd2xx; sys_platform == 'win32'",
  "pylibftdi; sys_platform != 'win32'",
]

plot = [
  "pyqtgraph",
  "PyQt6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["Morelia", "Morelia.*"]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/Pinnacle-Technology-Inc/Morelia"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
